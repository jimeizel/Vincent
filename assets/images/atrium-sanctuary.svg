<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D272E" />
      <stop offset="100%" stop-color="#16454C" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8FB3AE" stroke-width="0.5" stroke-opacity="0.1" />
    </pattern>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#2E7D74" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0B2027" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="520" fill="url(#bg)" />
  <rect width="800" height="520" fill="url(#glow)" />
  <rect width="800" height="520" fill="url(#grid)" />
  
  <!-- Architectural drafting grid & framing -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="720" height="440" rx="8" fill="#0B2027" fill-opacity="0.5" stroke="#2E7D74" stroke-width="1.5" />
    
    <!-- Wireframe geometry representing architectural structure -->
    <path d="M 60,340 L 240,140 L 480,140 L 660,340 Z" fill="none" stroke="#8FB3AE" stroke-width="1.5" stroke-opacity="0.55"/>
    <path d="M 240,140 L 240,340 M 480,140 L 480,340" stroke="#2E7D74" stroke-width="1.5" stroke-opacity="0.65"/>
    <path d="M 120,260 L 600,260" stroke="#8FB3AE" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.45"/>
    <circle cx="240" cy="140" r="5" fill="#2E7D74"/>
    <circle cx="480" cy="140" r="5" fill="#2E7D74"/>
    <circle cx="360" cy="140" r="4" fill="#8FB3AE"/>

    <!-- Category Pill Badge -->
    <rect x="50" y="45" width="130" height="28" rx="14" fill="#2E7D74" fill-opacity="0.3" stroke="#2E7D74" stroke-width="1" />
    <text x="115" y="64" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#8FB3AE" letter-spacing="1.5">INTERIOR</text>
    
    <!-- Title and Subtitle -->
    <text x="50" y="115" font-family="'Montserrat', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">Sunken Atrium Living Lounge</text>
    <text x="50" y="142" font-family="'Inter', sans-serif" font-size="14" fill="#8FB3AE">Architectural Spatial Design & 3D Visualization</text>
    
    <!-- Tools Badge -->
    <rect x="50" y="365" width="310" height="32" rx="6" fill="#10333A" stroke="#2E7D74" stroke-width="1" />
    <text x="65" y="386" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#D4E3E1">Modeled in SketchUp · Rendered in Photoshop</text>
    
    <!-- Coordinates & scale markings -->
    <text x="670" y="386" text-anchor="end" font-family="'Space Grotesk', monospace" font-size="12" fill="#8FB3AE" letter-spacing="1.5">SKETCHUP // 3D MODEL</text>
  </g>
</svg>